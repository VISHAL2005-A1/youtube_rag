name: Docker CI

on:
  push:
    branches:
      - main

jobs:
  docker-build-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build backend image
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/rag-backend:latest \
            ./backend

      - name: Push backend image
        run: |
          docker push \
            ${{ secrets.DOCKERHUB_USERNAME }}/rag-backend:latest

      - name: Build frontend image
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/rag-frontend:latest \
            ./frontend

      - name: Push frontend image
        run: |
          docker push \
            ${{ secrets.DOCKERHUB_USERNAME }}/rag-frontend:latest

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/rag-system

            cat > .env << EOF
            GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}
            QDRANT_URL=${{ secrets.QDRANT_URL }}
            QDRANT_API_KEY=${{ secrets.QDRANT_API_KEY }}
            QDRANT_COLLECTION=${{ secrets.QDRANT_COLLECTION }}
            YOUTUBE_API_KEY=${{ secrets.YOUTUBE_API_KEY }}
            WEBSHARE_PROXY_USERNAME=${{ secrets.WEBSHARE_PROXY_USERNAME }}
            WEBSHARE_PROXY_PASSWORD=${{ secrets.WEBSHARE_PROXY_PASSWORD }}
            EOF

            docker compose pull
            docker compose up -d
            
