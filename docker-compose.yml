services:
  backend:
    image: vishalhe123/rag-backend:latest
    container_name: rag-backend
    ports:
      - "8000:8000"
    env_file:
      - .env

  frontend:
    image: vishalhe123/rag-frontend:latest
    container_name: rag-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend